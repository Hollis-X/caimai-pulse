<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>财脉 Pulse</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="180x180" href="/icons/xm.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/xm.png">
<link rel="apple-touch-icon" href="/icons/xm.png">
<meta name="apple-mobile-web-app-title" content="财脉">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="api-secret" content="caimai-secret-change-me">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ═══ 新快讯悬浮提示 ═══ -->
<div class="flash-toast" id="flashToast" style="display:none;">
  <span id="flashToastText">0 条新快讯</span>
  <span class="toast-dot"></span>
</div>

<!-- ═══ 毛玻璃顶栏 ═══ -->
<header class="navbar" id="navbar">
  <div class="nav-inner">
    <button class="nav-back" id="navBack" style="display:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="nav-title" id="navTitle">财脉 Pulse</span>
    <div class="nav-actions">
      <button class="nav-btn" id="btnSearch" title="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
  <div class="search-bar" id="searchBar" style="display:none;">
    <input type="text" id="searchInput" class="search-input" placeholder="搜索快讯 / 资讯..." autocomplete="off">
    <button class="search-cancel" id="searchCancel">取消</button>
  </div>
</header>

<!-- ═══ 页面容器 ═══ -->
<div class="page-container" id="pageContainer">

  <div class="page page-main" id="pageMain">
    <div class="tab-scroll" id="tabScroll">
      <span class="tab-pill active" data-tab="flash">⚡ 快讯</span>
      <span class="tab-pill" data-tab="news">📰 资讯</span>
      <span class="tab-pill" data-tab="quote">📈 行情</span>
      <span class="tab-pill" data-tab="calendar">📅 日历</span>
    </div>
    <div class="content-area" id="contentArea">
    </div>
  </div>

  <!-- 详情页 -->
  <div class="page page-detail" id="pageDetail" style="display:none;">
    <div class="detail-scroll" id="detailScroll"></div>
  </div>

</div>

<!-- ═══ 底部导航 ═══ -->
<nav class="tabbar" id="tabbar">
  <div class="tabbar-item active" data-tab="flash">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span>快讯</span>
  </div>
  <div class="tabbar-item" data-tab="news">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="6" y1="8" x2="18" y2="8"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="6" y1="16" x2="12" y2="16"/></svg>
    <span>资讯</span>
  </div>
  <div class="tabbar-item" data-tab="quote">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    <span>行情</span>
  </div>
  <div class="tabbar-item" data-tab="calendar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>日历</span>
  </div>
</nav>

<!-- ═══ 新快讯浮动提示 ═══ -->
<div class="flash-toast" id="flashToast" style="display:none;">
  <span id="flashToastText">条新快讯</span>
</div>

<script src="/js/app.js"></script>
</body>
</html>
